name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delevry_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d delevry_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Set CI environment
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/delevry_ci?schema=public" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=ci-only-secret-with-at-least-32-characters" >> "$GITHUB_ENV"
          echo "DEMO_ADMIN_PASSWORD=CI-Only-Password-123!" >> "$GITHUB_ENV"
          echo "APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Package source artifact
        run: git archive --format=zip --output="delevry-dz-foundation-${GITHUB_SHA}.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: delevry-dz-foundation-${{ github.sha }}
          path: delevry-dz-foundation-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
