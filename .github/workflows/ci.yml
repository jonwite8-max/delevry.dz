name: CI
on:
  push:
    branches: [main, "feature/**", "foundation/**"]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delevry_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d delevry_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Set CI environment
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/delevry_ci?schema=public" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=ci-only-secret-with-at-least-32-characters" >> "$GITHUB_ENV"
          echo "DEMO_ADMIN_PASSWORD=CI-Only-Password-123!" >> "$GITHUB_ENV"
          echo "APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        if: always()
      - name: Package server-ready release
        if: always()
        run: |
          test -f .next/standalone/server.js
          PKG="delevry_dz_server"
          rm -rf "$PKG"
          mkdir -p "$PKG/.next"
          cp -a .next/standalone/. "$PKG/"
          cp -a .next/static "$PKG/.next/static"
          cp -a public "$PKG/public"
          cp -a prisma "$PKG/prisma"
          cp -a deployment "$PKG/deployment"
          cp package.json "$PKG/package.json"
          if [ -f package-lock.json ]; then cp package-lock.json "$PKG/package-lock.json"; fi
          printf "%s\n" "0.2.0-preview-server" > "$PKG/VERSION"
          printf "%s\n" "DELEVRY.DZ SERVER PREVIEW v0.2.0" "" "Upload/extract this package into the release directory." "Keep the real .env outside the archive and link/copy it server-side only." "Production runtime is prebuilt in .next/standalone." "Start: node .next/standalone/server.js" "Default bind: 127.0.0.1:3000 (set HOSTNAME/PORT as needed)." "Database migrations remain an explicit server administration step." > "$PKG/SERVER_RELEASE_README.txt"
          printf "%s\n" "{" "  \"project\": \"DELEVRY.DZ\"," "  \"version\": \"0.2.0-preview-server\"," "  \"type\": \"SERVER_REPLACE\"," "  \"commit\": \"${GITHUB_SHA}\"," "  \"requires_manual_build\": false," "  \"contains_prebuilt_next_standalone\": true," "  \"preserved_by_omission\": [\".env\", \"database data\", \"node_modules source tree\"]" "}" > "$PKG/release.json"
          printf "%s\n" "{" "  \"project\": \"DELEVRY.DZ\"," "  \"architecture\": \"Next.js Modular Monolith / Domain-Application Engines\"," "  \"runtime\": \"Node.js 24 + Next.js standalone + PostgreSQL\"," "  \"deployment\": \"Manual ZIP / server replace\"," "  \"business_logic_policy\": \"UI is presentation only; business rules remain centralized in Domain/Application engines\"" "}" > "$PKG/PROJECT_MANIFEST.json"
          zip -qr "delevry-dz-server-${GITHUB_SHA}.zip" "$PKG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delevry-dz-server-${{ github.sha }}
          path: delevry-dz-server-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
